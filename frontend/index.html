<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeEngine</title>

    <!-- Google Fonts: Inter for UI & JetBrains Mono for Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons for Premium UI Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Monaco Editor CSS & AMD Loader -->
    <link
      rel="stylesheet"
      data-name="vs/editor/editor.main"
      href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/editor/editor.main.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>

    <!-- External Style Sheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Floating Header -->
    <div class="navbar">
      <div class="logo-area">
        <div class="logo-icon">
          <i data-lucide="terminal" style="width: 14px; height: 14px"></i>
        </div>
        <span class="logo-text">CodeEngine</span>
        <span class="logo-badge">Beta</span>
      </div>

      <div class="nav-controls">
        <select id="language" class="language-selector">
          <option value="cpp" selected>C++</option>
          <option value="python">Python</option>
        </select>

        <button id="runBtn" class="btn btn-primary" onclick="submitCode()">
          <i
            data-lucide="play"
            id="runIcon"
            style="width: 13px; height: 13px"
          ></i>
          <span id="runText">Run Code</span>
        </button>

        <!-- Dynamic Dark/Light mode Toggle Button -->
        <button
          id="themeToggleBtn"
          class="icon-btn"
          onclick="toggleTheme()"
          title="Toggle Theme"
        >
          <i data-lucide="sun" id="themeIcon"></i>
        </button>

        <button
          class="icon-btn"
          onclick="toggleSettings()"
          title="IDE Settings"
        >
          <i data-lucide="sliders-horizontal"></i>
        </button>
      </div>
    </div>

    <!-- Main Workspace splits -->
    <div class="workspace">
      <!-- Left side: Code Editor -->
      <div class="editor-pane" id="editorPane">
        <div class="pane-header">
          <div class="tab-title">
            <i
              data-lucide="file-code"
              id="fileTabIcon"
              style="width: 13px; height: 13px"
            ></i>
            <span>main.</span><span id="extLabel">py</span>
          </div>
          <div class="header-actions">
            <!-- Custom Templates CP Controls -->
            <div
              class="template-controls"
              style="
                display: inline-flex;
                align-items: center;
                gap: 4px;
                margin-right: 8px;
                border-right: 1px solid var(--border);
                padding-right: 8px;
              "
            >
              <select
                id="templateSelector"
                class="template-select"
                onchange="loadTemplate(this.value)"
              >
                <option value="" disabled selected hidden>Templates</option>
              </select>
              <button
                class="btn"
                onclick="saveAsTemplate()"
                style="height: 26px; padding: 2px 8px; font-size: 11px"
                title="Save current workspace code as template"
              >
                Save as Template
              </button>
              <button
                class="icon-btn"
                onclick="deleteTemplate()"
                title="Delete Selected Template"
                style="padding: 4px"
              >
                <i data-lucide="trash-2" style="width: 13px; height: 13px"></i>
              </button>
            </div>

            <button
              class="icon-btn"
              onclick="copyCode()"
              title="Copy Code"
              id="copyCodeBtn"
            >
              <i data-lucide="copy"></i>
            </button>
            <button
              class="icon-btn"
              onclick="triggerUpload()"
              title="Upload File"
            >
              <i data-lucide="upload"></i>
            </button>
            <button
              class="icon-btn"
              onclick="downloadCode()"
              title="Download Code"
            >
              <i data-lucide="download"></i>
            </button>
            <button class="icon-btn" onclick="resetCode()" title="Reset Editor">
              <i data-lucide="rotate-ccw"></i>
            </button>
            <button
              class="icon-btn"
              onclick="toggleFullscreen()"
              title="Toggle Fullscreen"
            >
              <i data-lucide="maximize-2" id="fsIcon"></i>
            </button>
          </div>
        </div>
        <!-- Monaco container -->
        <div id="codeEditorContainer"></div>
      </div>

      <!-- Drag separator vertical -->
      <div class="resizer-v"></div>

      <!-- Right side: I/O controls -->
      <div class="io-pane">
        <!-- Input section -->
        <div class="stdin-section">
          <div class="pane-header">
            <div class="tab-title">
              <i
                data-lucide="text-cursor-input"
                style="width: 13px; height: 13px"
              ></i>
              <span>Standard Input</span>
            </div>
            <div class="header-actions">
              <button
                class="icon-btn"
                onclick="copyStdin()"
                title="Copy input"
                id="copyStdinBtn"
              >
                <i data-lucide="copy"></i>
              </button>
              <button
                class="icon-btn"
                onclick="clearStdin()"
                title="Clear input"
              >
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </div>
          <textarea
            id="stdinEditor"
            class="stdin-textarea"
            spellcheck="false"
            placeholder="System standard input contents..."
          ></textarea>
        </div>

        <!-- Drag separator horizontal -->
        <div class="resizer-h"></div>

        <!-- Output section -->
        <div class="stdout-section">
          <div class="pane-header">
            <div class="tab-title">
              <i data-lucide="terminal" style="width: 13px; height: 13px"></i>
              <span>Console Output</span>
              <span
                id="statusBadge"
                class="status-badge"
                style="display: none"
              ></span>
            </div>
            <div class="header-actions">
              <span
                id="metaInfo"
                class="meta-info"
                style="display: none"
              ></span>
              <button
                class="icon-btn"
                id="copyOutputBtn"
                onclick="copyOutput()"
                title="Copy output"
                style="display: none"
              >
                <i data-lucide="copy"></i>
              </button>
              <button
                class="icon-btn"
                onclick="clearOutput()"
                title="Clear output"
              >
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </div>
          <div id="outputContent" class="output-content">
            <div class="placeholder-text" id="outputPlaceholder">
              <i data-lucide="terminal" style="width: 20px; height: 20px"></i>
              <span>Output streams will be rendered here.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Sidebar Drawer -->
    <div class="sidebar-overlay" onclick="toggleSettings()"></div>
    <div class="settings-sidebar" id="settingsSidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Preferences</div>
        <button class="icon-btn" onclick="toggleSettings()">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="setting-item">
        <div class="setting-label">Font Size</div>
        <div class="setting-desc">Adjust the code font display size</div>
        <select id="settingFontSize" class="styled-select">
          <option value="12">12px</option>
          <option value="13">13px</option>
          <option value="14" selected>14px</option>
          <option value="15">15px</option>
          <option value="16">16px</option>
        </select>
      </div>

      <div class="setting-item">
        <div class="setting-label">Tab Size</div>
        <div class="setting-desc">Configure code indent spacing width</div>
        <select id="settingTabSize" class="styled-select">
          <option value="2">2 spaces</option>
          <option value="4" selected>4 spaces</option>
          <option value="8">8 spaces</option>
        </select>
      </div>

      <div class="setting-row">
        <div>
          <div class="setting-label">Word Wrap</div>
          <div class="setting-desc">Wrap lines longer than screen width</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="settingWordWrap" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div>
          <div class="setting-label">Minimap</div>
          <div class="setting-desc">Show editor code map outline</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="settingMinimap" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Hidden upload element -->
    <input
      type="file"
      id="fileInput"
      style="display: none"
      onchange="handleFileUpload(event)"
    />

    <!-- Toasts floating list -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- External Script file for logic -->
    <script src="app.js"></script>
  </body>
</html>
